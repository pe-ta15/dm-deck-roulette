name: Render deck case opening
on:
  push:
    paths:
      - ".github/workflows/render-opening.yml"
      - "tools/render_case_opening.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rendering tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pil
      - name: Render WebM
        run: python3 tools/render_case_opening.py
      - name: Commit rendered video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add case-opening.webm
          git commit -m "Improve deck case opening WebM" || exit 0
          git push

name: Render deck case opening
on:
  push:
    paths:
      - ".github/workflows/render-opening.yml"
      - "tools/render_case_opening.py"
      - "index.html"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate page JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if not scripts:
              raise SystemExit("No inline application script found")
          Path("/tmp/dm-deck-roulette.js").write_text(scripts[-1], encoding="utf-8")
          PY
          node --check /tmp/dm-deck-roulette.js
      - name: Install Blender and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y blender ffmpeg libegl1 libgl1 libgles2 libglx-mesa0 libegl-mesa0
      - name: Render realistic 3D WebM
        run: |
          blender --background --python tools/render_case_opening.py
          ffmpeg -y -framerate 24 -i /tmp/case-opening-frames/frame_%04d.png -c:v libvpx -b:v 2400k -crf 8 -deadline good -cpu-used 4 -pix_fmt yuv420p -an case-opening.webm
      - name: Verify WebM codec and dimensions
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,pix_fmt -of default=noprint_wrappers=1 case-opening.webm
          test -s case-opening.webm
      - name: Commit rendered video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add case-opening.webm
          git commit -m "Render realistic 3D deck case opening" || exit 0
          git push

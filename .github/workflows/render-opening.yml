name: Validate DM deck roulette
on:
  pull_request:
    paths:
      - "index.html"
      - ".github/workflows/render-opening.yml"
  push:
    branches:
      - main
    paths:
      - "index.html"
      - ".github/workflows/render-opening.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and validate inline JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          html = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          if len(scripts) != 1:
              raise SystemExit(f"Expected one inline application script, found {len(scripts)}")
          Path("/tmp/dm-deck-roulette.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check /tmp/dm-deck-roulette.js
      - name: Check required case and draw behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          html = Path("index.html").read_text(encoding="utf-8")
          checks = {
              "one shared deck-case element": len(re.findall(r'id=["\\']deckCase["\\']', html)) == 1,
              "one case-ray layer": len(re.findall(r'class=["\\'][^"\\']*\\bcase-rays\\b[^"\\']*["\\']', html)) == 1,
              "no WebM playback reference": not re.search(r"case-opening\\.webm|<video\\b", html, re.I),
              "milky translucent case styling": "rgba(207,218,214" in html,
              "white cut-in background": "#drawingCard.mana-absorption.opening-cutin" in html and "background:#fff!important" in html,
              "deck list API retained": "${API_BASE}/decks" in html,
              "draw API retained": "${API_BASE}/spin" in html,
              "last-three exclusion retained": bool(re.search(r"\\.slice\\(0,\\s*3\\)", html)),
              "key-card image flow retained": "getKeyCardImageUrls(deck)" in html,
              "case-opening animation retained": "function playCaseOpeningSequence()" in html,
              "winner title animation retained": "@keyframes deckTitleShine" in html,
          }
          failed = [name for name, passed in checks.items() if not passed]
          for name, passed in checks.items():
              print(("PASS" if passed else "FAIL") + " - " + name)
          if failed:
              sys.exit(1)
          PY

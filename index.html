<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMデッキルーレット</title>
  <style>
    :root{color-scheme:light;--bg:#f5f6f8;--accent:#e9b94f;--text:#252a35;--muted:#6f7787
}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;padding:28px 16px 48px;background:radial-gradient(ellipse at top,#fff 0%,transparent 70%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
    main{width:100%;max-width:850px;margin:0 auto}
    h1{margin:0 0 10px;font-size:clamp(1.8rem,5vw,2.7rem);letter-spacing:.04em}
    .subtitle{color:var(--muted);margin:0 0 28px}
    .panel{padding:22px;margin-bottom:22px;border:1px solid #e1e4eb;border-radius:18px;background:rgb(255 255 255 / 95%);box-shadow:0 8px 28px rgb(35 45 65 / 8%)}
    .settings{display:flex;justify-content:center;margin:20px 0 0}
    .checkbox-label{display:flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid #e1e4eb;border-radius:12px;background:#f8f9fb;cursor:pointer;text-align:left}
    .checkbox-label input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex:0 0 auto}
    button{min-height:48px;padding:12px 28px;border:0;border-radius:12px;background:linear-gradient(135deg,#ffe6a1,#e9ae42);color:#241908;font-size:1.05rem;font-weight:800;cursor:pointer;transition:transform .15s,filter .15s}
    button:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.08)}
    button:disabled{background:#b8bdc7;color:#fff;opacity:1;cursor:wait;box-shadow:none;transform:none;filter:none}
    #status{color:var(--muted);font-size:.92rem}
    .hidden{display:none!important}
    #result{z-index:12;place-items:center;font-size:clamp(1.35rem,4.6vw,2rem);font-weight:900;}
    #result:empty{display:none}
    
    .result-reveal{animation:resultReveal .75s ease-out both}
    @keyframes resultReveal{0%{opacity:0;transform:scale(.65);text-shadow:0 0 0 transparent}55%{opacity:1;transform:scale(1.12);text-shadow:0 0 12px #fff0b2,0 0 32px #ffcf57,0 0 58px #f99c28}100%{opacity:1;transform:scale(1);text-shadow:0 0 18px rgb(255 205 92 / 40%)}}
    .roulette-panel{padding:12px 18px 14px;margin-bottom:16px}.card-stage{position:relative;width:100%;max-width:620px;min-height:0;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:208px auto;row-gap:0;justify-items:center;align-items:start;isolation:isolate;overflow:visible}
    #cardStage #drawingCard{grid-column:1;grid-row:1;justify-self:center;margin:0 auto}
    #cardStage #keyCardImages{grid-column:1;grid-row:2;justify-self:center;margin:0 auto}
    .mana-absorption{position:relative;width:min(100%,440px);height:208px;display:grid;place-items:center;isolation:isolate;overflow:visible}
    .mana-absorption:before,.mana-absorption:after{content:"";position:absolute;left:50%;top:50%;border:1px solid rgb(160 174 220 / 0%);border-radius:50%;pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.7)}
    .mana-absorption.charging:before{opacity:1;animation:runeSpin 2.85s linear both}
    .mana-absorption.charging:after{width:188px;height:188px;border:1px dashed rgb(177 151 225 / 85%);opacity:1;animation:runeSpinReverse 2.85s linear both}
    .drawing-card{position:absolute;z-index:2;left:50%;top:50%;width:132px;max-width:42%;aspect-ratio:5/7;border:2px solid #aab4cf;border-radius:13px;background:radial-gradient(circle at center,#f7f8ff 0%,#d7def0 46%,#aab6d4 100%);box-shadow:0 0 24px rgb(109 143 255 / 28%);display:grid;place-items:center;overflow:hidden;transform:translate(-50%,-50%);animation:cardPulse 1.2s ease-in-out infinite alternate}
    /* 当選デッキの文明色をカード外周に明確に表示。複数文明は連続したグラデーション */
    .drawing-card.deck-civ-colored{
      border:10px solid transparent;
      background:radial-gradient(circle at center,#f7f8ff 0%,#d7def0 46%,#aab6d4 100%) padding-box,var(--deck-civ-gradient) border-box;
      box-shadow:0 0 12px 2px var(--deck-civ-glow),0 0 30px 5px var(--deck-civ-glow),0 0 58px rgb(255 255 255 / 48%),inset 0 0 22px rgb(255 255 255 / 58%);
      animation:civFramePulse 1.05s ease-in-out infinite alternate
    }
    .drawing-card.deck-civ-colored:before{inset:4px;border:2px solid rgb(255 255 255 / 96%);box-shadow:inset 0 0 16px var(--deck-civ-glow),0 0 12px var(--deck-civ-glow)}
    .mana-absorption.charging .drawing-card.deck-civ-colored{border-width:10px;box-shadow:0 0 18px 3px var(--deck-civ-glow),0 0 42px 7px var(--deck-civ-glow),0 0 72px rgb(255 255 255 / 55%),inset 0 0 28px rgb(255 255 255 / 70%);animation:cardChargeCiv .72s ease-in-out infinite alternate}
    .mana-absorption.charging .drawing-card.deck-civ-colored:before{box-shadow:inset 0 0 22px var(--deck-civ-glow),0 0 20px var(--deck-civ-glow)}
    @keyframes cardChargeCiv{from{transform:translate(-50%,-50%) scale(1);filter:brightness(1.15) saturate(1.25)}to{transform:translate(-50%,-50%) scale(1.075);filter:brightness(1.7) saturate(1.8)}}
    @keyframes civFramePulse{from{filter:brightness(1.08) saturate(1.2);box-shadow:0 0 16px var(--deck-civ-glow),0 0 34px var(--deck-civ-glow),inset 0 0 18px rgb(255 255 255 / 35%)}to{filter:brightness(1.6) saturate(1.7);box-shadow:0 0 28px var(--deck-civ-glow),0 0 62px var(--deck-civ-glow),0 0 90px rgb(255 255 255 / 40%),inset 0 0 30px rgb(255 255 255 / 68%)}}
    .drawing-card:before{content:"";position:absolute;inset:8px;border:1px solid rgb(255 255 255 / 75%);border-radius:8px}
    .drawing-card:after{content:"DM";position:absolute;font-size:2.8rem;font-weight:900;letter-spacing:.05em;color:rgb(255 255 255 / 42%)}
    .drawing-label{z-index:1;padding:6px 9px;border-radius:8px;background:rgb(10 13 24 / 78%);color:#fff;font-size:.82rem;font-weight:800;letter-spacing:.12em}
    @keyframes cardPulse{from{box-shadow:0 0 16px rgb(109 143 255 / 20%)}to{box-shadow:0 0 36px rgb(109 143 255 / 55%)}}
    /* 抽選開始から中央に見せておく実物風デッキケース */
    .drawing-card.case-mode{opacity:0;pointer-events:none;animation:none}
    /* 縦長のトレーディングカード用デッキケース。背面上端を軸に蓋が上へ開く */
    /* 無地の縦型デッキケース。奥側ヒンジのフリップトップ蓋＋前面マグネット */
    /* 厚みのあるハードケース本体。正面壁・側面壁・内側の収納空間を別レイヤーで表現 */
    .deck-case{position:absolute;z-index:2;left:50%;top:50%;width:154px;height:202px;transform:translate(-50%,-50%) perspective(900px) rotateX(9deg) rotateY(-4deg) scale(1);transform-style:preserve-3d;opacity:1;filter:drop-shadow(0 18px 20px rgb(0 0 0 / 48%));pointer-events:none;transition:transform .55s cubic-bezier(.2,.75,.25,1),opacity .45s ease,filter .8s ease;will-change:transform}
    .case-body{position:absolute;}
    .case-body:after{content:"";position:absolute;z-index:2;}
    .case-spectrum{position:absolute;}
    /* 蓋は箱の上面を覆う厚い板。奥側ヒンジから後方へ大きく回転 */
    .case-lid{position:absolute;z-index:7;left:2px;right:2px;top:0;height:58px;border:3px solid #657181;border-bottom:5px solid #151c26;border-radius:9px 9px 5px 5px;background:linear-gradient(180deg,#8793a3 0%,#4b5666 18%,#293341 68%,#151c26 100%);box-shadow:inset 0 3px 7px rgb(255 255 255 / 30%),inset 0 -7px 10px rgb(0 0 0 / 65%),0 8px 10px rgb(0 0 0 / 52%);transform-origin:50% 0%;transform:rotateX(0deg) translateZ(0);transform-style:preserve-3d;backface-visibility:visible}
    .case-lid:before{content:"";position:absolute;}
    .case-lid:after{content:"";position:absolute;border-radius:0 0 3px 3px;}
    .case-hinge{position:absolute;}
    .case-lock{position:absolute;left:50%;transform:translateX(-50%);}
    .case-lock:after{content:"";position:absolute;left:50%;top:50%;width:5px;height:5px;transform:translate(-50%,-50%);border-radius:50%;}
    .case-glow{position:absolute;z-index:3;inset:13px 9px 10px;opacity:0;border-radius:5px;background:var(--case-civ-gradient,linear-gradient(90deg,#b9d8ff,#d9e0eb));mix-blend-mode:screen;filter:blur(10px);transition:opacity 1s ease;pointer-events:none}
    .case-light{position:absolute;left:50%;transform:translate(-50%,-50%) scale(.2);opacity:0;border-radius:50%;background:radial-gradient(ellipse,#fff 0%,var(--case-civ-glow,#b9d8ff) 38%,transparent 76%);pointer-events:none}
    .deck-case.civ-charging{filter:drop-shadow(0 10px 14px rgb(0 0 0 / 42%))}
    .deck-case.civ-charging .case-body{border-color:#778397;box-shadow:inset 0 3px 7px rgb(255 255 255 / 16%),inset 0 -10px 15px rgb(0 0 0 / 48%),inset 0 0 22px var(--case-civ-glow,#d9e0eb);transition:box-shadow 1.8s ease}
    .deck-case.civ-charging .case-spectrum{opacity:.78}
    .deck-case.civ-charging .case-glow{opacity:.82}
    .deck-case.civ-charging .case-light{animation:caseLightIn 1.5s ease-out forwards}
    .deck-case.pressure .case-body{animation:casePressure .16s ease-in-out infinite alternate}
    .deck-case.pressure .case-glow,.deck-case.opening .case-glow{opacity:1;filter:blur(5px)}
    .deck-case.pressure .case-light{opacity:.9;animation:corePulse .32s ease-in-out infinite alternate}
    .deck-case.pressure .case-lock{animation:lockStrain .22s ease-in-out infinite alternate}
    .deck-case.opening .case-lock{animation:magnetRelease .16s ease-in both}
    
    
    
    
    @keyframes magnetRelease{0%{transform:translateX(-50%) translateY(0) scale(1)}45%{transform:translateX(-50%) translateY(6px) scale(1.25);filter:brightness(2.5)}100%{transform:translateX(-50%) translateY(2px);filter:brightness(1.4)}}
    @keyframes caseLightIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}100%{opacity:.58;transform:translate(-50%,-50%) scale(1)}}
    @keyframes corePulse{from{transform:translate(-50%,-50%) scale(.75);opacity:.55}to{transform:translate(-50%,-50%) scale(1.35);opacity:1}}
    
    @keyframes casePressure{from{transform:translateY(0) scale(1)}to{transform:translateY(-1px) scale(1.025,1.012)}}
    @keyframes lockStrain{from{transform:translateX(-50%) rotate(-3deg)}to{transform:translateX(-50%) rotate(3deg)}}
    /* 奥側の蝶番を固定軸に、蓋の板面が後方へ倒れる。位置移動ではなく回転 */

    /* 決壊時の圧力波と文明色の破片 */
    .case-burst{position:absolute;z-index:7;left:50%;top:48%;width:34px;height:34px;border:4px solid #fff;border-radius:50%;opacity:0;pointer-events:none;transform:translate(-50%,-50%) scale(.2);box-shadow:0 0 12px 5px #fff,0 0 28px 12px var(--case-civ-glow,#fff),inset 0 0 14px #fff}
    .case-burst:before,.case-burst:after{content:"";position:absolute;inset:-15px;border:2px solid var(--case-civ-glow,#fff);border-radius:50%;box-shadow:0 0 18px var(--case-civ-glow,#fff)}
    .case-burst:after{inset:-29px;border-width:1px;border-color:rgb(255 255 255 / 90%)}
    
    @keyframes ruptureWave{0%{opacity:0;transform:translate(-50%,-50%) scale(.12)}12%{opacity:1}38%{opacity:1;transform:translate(-50%,-50%) scale(3.2)}100%{opacity:0;transform:translate(-50%,-50%) scale(8)}}
    /* ケースの口からカードが飛び出し、手前で回転して正面を向く */
    #manaTrailCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;overflow:visible}
    .mana-orb{position:absolute;z-index:4;left:50%;top:50%;display:block;object-fit:contain;opacity:0;filter:drop-shadow(0 0 7px var(--mana-color)) drop-shadow(0 0 18px var(--mana-color));will-change:transform,opacity;pointer-events:none}
    .mana-orb.fire{--mana-color:#e53935}
    .mana-orb.light{--mana-color:#f2c600}
    .mana-orb.nature{--mana-color:#299b45}
    .mana-orb.water{--mana-color:#168bd2}
    .mana-orb.darkness{--mana-color:#743c9b}
    .mana-orb{transform-origin:center;backface-visibility:hidden}
    .mana-orb.fire{filter:drop-shadow(0 0 5px #ff4b35) drop-shadow(0 0 15px #e53935) drop-shadow(0 0 26px rgb(229 57 53 / 55%))}
    .mana-orb.light{filter:drop-shadow(0 0 6px #fff2a0) drop-shadow(0 0 16px #f2c600) drop-shadow(0 0 28px rgb(242 198 0 / 60%))}
    .mana-orb.nature{filter:drop-shadow(0 0 5px #7dff8c) drop-shadow(0 0 15px #299b45) drop-shadow(0 0 26px rgb(41 155 69 / 55%))}
    .mana-orb.water{filter:drop-shadow(0 0 5px #8be4ff) drop-shadow(0 0 15px #168bd2) drop-shadow(0 0 26px rgb(22 139 210 / 55%))}
    .mana-orb.darkness{filter:drop-shadow(0 0 5px #d49aff) drop-shadow(0 0 15px #743c9b) drop-shadow(0 0 26px rgb(116 60 155 / 60%))}
    .mana-absorption.charging .drawing-card{animation:cardCharge .72s ease-in-out infinite alternate}
    
    @keyframes cardCharge{from{transform:translate(-50%,-50%) scale(1);filter:brightness(1) saturate(1)}to{transform:translate(-50%,-50%) scale(1.065);filter:brightness(1.38) saturate(1.25)}}
    .mana-absorption.absorbing:after{content:"";position:absolute;z-index:5;left:50%;top:50%;width:240px;height:240px;border-radius:50%;border:3px solid rgb(255 255 255 / 85%);box-shadow:0 0 25px #fff,0 0 55px #e9c85c,0 0 85px #8e8cff;pointer-events:none;animation:finalShockwave .72s cubic-bezier(.12,.7,.2,1) both}
    @keyframes finalShockwave{0%{opacity:0;transform:translate(-50%,-50%) scale(.12)}22%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}}
    .mana-absorption.absorbing .drawing-card{animation:cardAbsorb .72s cubic-bezier(.2,.85,.25,1) both}
    @keyframes cardAbsorb{0%{transform:translate(-50%,-50%) scale(1);filter:brightness(1)}42%{transform:translate(-50%,-50%) scale(1.13);filter:brightness(1.75)}72%{transform:translate(-50%,-50%) scale(.97);filter:brightness(1.2)}100%{transform:translate(-50%,-50%) scale(1.06);filter:brightness(1.35)}}
    .mana-absorption.absorbing{animation:stageFlash .72s ease-out both}
    @keyframes stageFlash{0%{filter:brightness(1)}24%{filter:brightness(2.7)}48%{filter:brightness(1.65)}100%{filter:brightness(1)}}
    .card-stage.absorption-burst{animation:stageImpact .42s ease-out both}
    @keyframes runeSpin{from{transform:translate(-50%,-50%) rotate(0deg) scale(.8)}to{transform:translate(-50%,-50%) rotate(360deg) scale(1.12)}}
    @keyframes runeSpinReverse{from{transform:translate(-50%,-50%) rotate(360deg) scale(1.12)}to{transform:translate(-50%,-50%) rotate(0deg) scale(.8)}}
    #keyCardImages{position:relative;z-index:5;justify-self:stretch!important;min-width:0;}
    #keyCardImages img{border-radius:9px;box-shadow:0 8px 20px rgb(0 0 0 / 20%);transform-style:preserve-3d;backface-visibility:visible}
    
    
    
    .card-stage.absorption-burst:before{content:"";position:absolute;z-index:1;left:50%;top:50%;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#fff 0%,rgb(255 255 255 / 80%) 12%,rgb(255 220 100 / 55%) 30%,rgb(110 160 255 / 18%) 58%,transparent 72%);pointer-events:none;animation:absorbFlash .55s ease-out both}
    @keyframes absorbFlash{0%{opacity:0;transform:translate(-50%,-50%) scale(.15)}24%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(2.3)}}
    .card-stage.winner:before{content:"";position:absolute;z-index:0;left:50%;top:50%;border-radius:50%;pointer-events:none;animation:lightBurst 1.1s ease-out both}
    .card-stage.winner:after{content:"";position:absolute;z-index:0;left:50%;top:50%;width:190px;height:190px;border:2px solid rgb(255 224 128 / 85%);border-radius:50%;pointer-events:none;animation:ringBurst .9s ease-out both}
    @keyframes lightBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.1)}35%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(2.5)}}
    @keyframes ringBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(2.1)}}
    .particle{position:absolute;z-index:3;width:var(--size,6px);height:var(--size,6px);border-radius:50%;pointer-events:none;background:radial-gradient(circle,#fffbdc 0%,#ffd45e 55%,#ff9c2d 100%);box-shadow:0 0 9px 2px rgb(255 213 96 / 75%);animation:particleFly var(--duration,1s) ease-out forwards}
    #result.result-reveal{position:relative;color:#8b5a08;text-shadow:0 0 12px rgb(255 226 143 / 80%),0 0 28px rgb(255 190 65 / 45%)}
    @keyframes particleFly{0%{opacity:0;transform:translate(0,0) scale(.2)}15%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(0)}}
    .fallback{width:100%;padding:28px 14px;color:var(--muted);line-height:1.7}
    .deck-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;padding:0;margin:18px 0 0;list-style:none;text-align:left}
    .deck-list li{padding:12px 14px;border:1px solid #e1e4eb;border-radius:10px;background:#f8f9fb;overflow-wrap:anywhere}
    .deck-list li.excluded{opacity:.48}
    .small-note{color:var(--muted);font-size:.85rem}
    @media(max-width:480px){body{padding:12px 10px 24px}.panel{padding:12px 10px}.roulette-panel{margin-bottom:12px}.card-stage{min-height:0;grid-template-rows:194px auto}.mana-absorption{height:194px}}
    
    /* 吸収時に短く画面を揺らす */
    .card-stage.absorption-burst{animation:stageImpact .48s ease-out both}
    @keyframes stageImpact{0%,100%{transform:translateX(0)}18%{transform:translateX(-5px)}36%{transform:translateX(5px)}54%{transform:translateX(-3px)}72%{transform:translateX(2px)} }
    /* 周回中は文明色の光を強め、軌道を見やすくする */
    .mana-absorption.charging .drawing-card{box-shadow:0 0 24px rgb(109 143 255 / 42%),0 0 52px rgb(160 133 255 / 28%),inset 0 0 24px rgb(255 255 255 / 25%)}
    .mana-absorption.charging .drawing-card:before{box-shadow:inset 0 0 22px rgb(255 255 255 / 72%),0 0 22px rgb(255 255 255 / 48%)}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}

    /* ===== Premium treasure-reveal redesign ===== */
    .roulette-panel{display:flex;flex-direction:column;align-items:stretch;gap:0;padding:10px 14px 12px}
    #cardStage{width:100%;max-width:620px;min-height:0;margin:0 auto;grid-template-rows:214px auto;row-gap:0;overflow:visible}
    #drawingCard.mana-absorption{width:100%;}
    #result{align-self:center}
    
    #result.result-reveal{margin:0!important}
    #spinButton{margin:8px auto 0;flex:0 0 auto}
    #status{min-height:0;margin:7px 0 0;line-height:1.25}
    #settings{margin:8px 0 0}
    .card-stage{perspective:1200px}
    .mana-absorption:before{width:290px;height:190px;border:1px solid rgb(255 219 137 / 0%);background:radial-gradient(ellipse,rgba(255,205,100,.10),transparent 68%)}
    .mana-absorption.charging:before{box-shadow:0 0 34px rgba(255,190,80,.20),inset 0 0 25px rgba(255,220,150,.12)}
    .deck-case{width:198px;height:164px;top:51%;transform:translate(-50%,-50%) perspective(1050px) rotateX(7deg) rotateY(-8deg) scale(1);transform-style:preserve-3d;filter:drop-shadow(0 22px 18px rgba(0,0,0,.58));transition:transform .72s cubic-bezier(.2,.72,.18,1),filter .7s ease,opacity .45s ease}
    .case-body{left:4px;right:4px;top:42px;bottom:3px;border-radius:5px 5px 15px 15px;transform:translateZ(0);overflow:visible}
    .case-body:after{left:5px;right:5px;top:-1px;height:15px;border:2px solid #aab4c2;border-bottom:4px solid #111923;background:linear-gradient(180deg,#d2d9e1 0%,#687587 38%,#293442 78%,#111923 100%);box-shadow:0 4px 7px rgba(0,0,0,.8)}
    /* ケース内部は乳白色樹脂。暗い収納穴や黒い縁取りは作らない。 */
    .case-cavity{position:absolute;z-index:2;left:18px;right:18px;top:5px;bottom:15px;border:0;border-radius:4px;background:linear-gradient(180deg,rgba(250,252,250,.82),rgba(232,240,235,.9) 58%,rgba(216,229,220,.84));box-shadow:inset 0 1px 6px rgba(255,255,255,.94),inset 0 -3px 8px rgba(132,151,140,.10);pointer-events:none}
    .case-spectrum{z-index:4;left:24px;right:24px;top:48px;bottom:22px;border-radius:50%;background:var(--case-civ-gradient,linear-gradient(90deg,#9aa7bd,#d9e0eb));opacity:0;mix-blend-mode:screen;filter:blur(13px);transform:scale(.35);transition:opacity 1.2s ease,transform 1.4s ease}
    .case-lid{z-index:9;left:0;right:0;top:0;height:52px;border-radius:11px 11px 4px 4px;transform-origin:50% 0%;transform:rotateX(0deg) translateZ(0);transform-style:preserve-3d;backface-visibility:visible}
    .case-lid:before{left:9px;right:9px;top:7px;height:32px;border-radius:5px;}
    .case-lid:after{left:2px;right:2px;bottom:-7px;height:7px;}
    .case-lid-inner{position:absolute;inset:5px 7px 7px;border:2px solid rgba(255,255,255,.12);border-radius:5px;background:linear-gradient(145deg,#273344,#101722 70%,#05090f);box-shadow:inset 0 0 18px rgba(0,0,0,.8);transform:translateZ(-2px);backface-visibility:visible}
    .case-hinge{z-index:10;left:12px;right:12px;top:0;height:12px;border-radius:7px;}
    .case-lock{z-index:12;top:48px;width:34px;height:16px;border-radius:4px;}

.deck-case .case-back-image{position:absolute!important;display:block!important;z-index:1!important;left:-10%!important;top:-5%!important;width:120%!important;height:110%!important;max-width:none!important;object-fit:fill!important;object-position:center!important;border:0!important;border-radius:0!important;box-shadow:none!important;pointer-events:none!important}

.deck-case .case-glow{z-index:3!important;inset:46px 18px 12px!important;border-radius:3px!important;background:var(--case-civ-gradient,linear-gradient(90deg,#fff,#edf3ef))!important;mix-blend-mode:screen!important}
.deck-case .case-lid{border:2px solid rgba(218,230,222,.98)!important;border-bottom:2px solid rgba(205,220,210,.94)!important;background:linear-gradient(145deg,#fff 0%,#edf4ef 52%,#fbfdfb 100%)!important;box-shadow:inset 0 2px 5px rgba(255,255,255,.98),0 1px 3px rgba(110,130,117,.06)!important;backface-visibility:visible!important}
.deck-case .case-lid-inner{border:1px solid rgba(255,255,255,.98)!important;background:linear-gradient(145deg,rgba(255,255,255,.58),rgba(255,255,255,.38)),linear-gradient(145deg,#fff,#edf4ef)!important;box-shadow:inset 0 0 4px rgba(255,255,255,.98)!important;transform:translateZ(-1px)!important}
     /* 蓋の裏面そのものを発光面にする。疑似要素や色混合に頼らず、裏面の背景と内側の光を直接描画する。 */
     .deck-case .case-lid-inner{
       position:absolute!important;
       overflow:hidden!important;
       transition:background 1s ease,box-shadow 1s ease,filter 1s ease!important
     }
     .deck-case.civ-charging .case-lid-inner{
       background:linear-gradient(145deg,rgba(255,255,255,.58),rgba(255,255,255,.38)),var(--case-civ-gradient)!important;
       box-shadow:
         inset 0 0 12px var(--case-civ-glow),
         inset 0 0 28px color-mix(in srgb,var(--case-civ-glow) 48%,transparent),
         0 0 16px color-mix(in srgb,var(--case-civ-glow) 42%,transparent)!important;
       filter:brightness(1.12) saturate(1.25)
     }
     .deck-case.pressure .case-lid-inner,
      .deck-case.opening .case-lid-inner{
        box-shadow:
          inset 0 0 16px var(--case-civ-glow),
          inset 0 0 34px color-mix(in srgb,var(--case-civ-glow) 62%,transparent),
          0 0 22px color-mix(in srgb,var(--case-civ-glow) 55%,transparent)!important;
        filter:brightness(1.12) saturate(1.25)
      }
      /* 蓋裏面にも本体と同じ文明色の発光層を設け、光そのものを同期して明滅させる。 */
      .deck-case .case-lid-inner:after{
        content:"";
        position:absolute;
        z-index:1;
        inset:0;
        border-radius:4px;
        background:var(--case-civ-gradient,linear-gradient(90deg,#fff,#edf3ef));
        /* 白い蓋面で発光色が白飛びしないよう、通常合成で色と明滅を見せる。 */
        mix-blend-mode:normal;
        filter:blur(3px) saturate(1.15);
        opacity:0;
        pointer-events:none
      }
      .deck-case.civ-charging .case-lid-inner:after{
        opacity:.82
      }
      .deck-case.pressure .case-lid-inner:after,
      .deck-case.opening .case-lid-inner:after{
        opacity:1;
        animation:caseEnergyPulse .42s ease-in-out infinite alternate
      }
      /* 本体の発光層と蓋裏面の発光層に同じ明滅周期を適用する。 */
      .deck-case.pressure .case-glow,
      .deck-case.opening .case-glow{
        animation:caseEnergyPulse .42s ease-in-out infinite alternate
      }
      @keyframes caseEnergyPulse{
        from{opacity:.62}
        to{opacity:1}
      }
      .deck-case .case-lid:before{border-color:rgba(255,255,255,.98)!important;background:linear-gradient(135deg,rgba(255,255,255,.82),rgba(225,236,228,.12) 55%,rgba(190,207,195,.06))!important;box-shadow:inset 0 0 4px rgba(255,255,255,.9)!important}
.deck-case .case-lid:after{border:1px solid rgba(210,222,214,.98)!important;background:linear-gradient(90deg,#fff,#edf4ef 50%,#fff)!important;box-shadow:0 1px 2px rgba(100,118,107,.04)!important}

.deck-case .case-lock:after{background:#c5d4ca!important;box-shadow:none!important}
.deck-case.opening .case-body,.deck-case.pressure .case-body,.deck-case.civ-charging .case-body{border-color:rgba(216,228,220,.98)!important;box-shadow:inset 2px 0 4px rgba(255,255,255,.96),inset -2px 0 4px rgba(160,178,166,.06),inset 0 0 12px var(--case-civ-glow,rgba(255,255,255,.16)),0 1px 3px rgba(110,130,117,.05)!important}
.deck-case,.deck-case.civ-charging,.deck-case.pressure,.deck-case.opening{filter:drop-shadow(0 8px 12px rgba(116,132,122,.12))!important}

<body>
  <main>
    <h1>DMデッキルーレット</h1>
    <p class="subtitle">次に使用するデッキを抽選します</p>
    <section class="panel roulette-panel">
      <div id="cardStage" class="card-stage hidden">
        <div id="drawingCard" class="mana-absorption hidden" aria-label="5文明の力を吸収して抽選中">
          <div class="drawing-card case-mode"><span class="drawing-label">抽選中</span></div>
          <div class="deck-case" id="deckCase" aria-hidden="true">
            <div class="case-body">
              <div class="case-cavity"><img class="case-back-image" src="assets/card-back.webp" alt="" aria-hidden="true" draggable="false"></div>
              
              <div class="case-spectrum"></div>
              <div class="case-glow"></div>
            </div>
            <div class="case-hinge"></div>
            <div class="case-lid"><div class="case-lid-inner"></div></div>
            <div class="case-lock"></div>
            <div class="case-light"></div>
            <div class="case-rays" aria-hidden="true"></div>
            <div class="case-burst"></div>
          </div>
          <img class="mana-orb fire" src="icons/fire.png" alt="" aria-hidden="true">
          <img class="mana-orb light" src="icons/light.png" alt="" aria-hidden="true">
          <img class="mana-orb nature" src="icons/nature.png" alt="" aria-hidden="true">
          <img class="mana-orb water" src="icons/water.png" alt="" aria-hidden="true">
          <img class="mana-orb darkness" src="icons/darkness.png" alt="" aria-hidden="true">
        </div>
        <div id="keyCardImages"></div>
      </div>
      <div id="revealFlash" aria-hidden="true"></div>
      <div id="result" aria-live="polite"></div>
      <button type="button" id="spinButton" disabled>準備中...</button>
      <p id="status" role="status" aria-live="polite">デッキを読み込み中です。</p>
      <div id="settings" class="settings">
        <label class="checkbox-label">
          <input type="checkbox" id="avoidRepeat">
          <span>直近当選したデッキを抽選から除外する</span>
        </label>
      </div>
    </section>
    <section class="panel">
      <h2>抽選対象のデッキ</h2>
      <p class="small-note">一覧の「ルーレット」が有効になっているデッキが抽選対象です。</p>
      <ul id="deckList" class="deck-list"></ul>
    </section>
  </main>
  <script>
    const API_BASE = "https://dm-deck-roulette-api.nabkde16ngh.workers.dev";

    const spinButton = document.getElementById("spinButton");
    const statusElement = document.getElementById("status");
    const resultElement = document.getElementById("result");
    const deckListElement = document.getElementById("deckList");
    const drawingCard = document.getElementById("drawingCard");
    const deckCase = document.getElementById("deckCase");
    const revealFlashElement = document.getElementById("revealFlash");
    const cardStage = document.getElementById("cardStage");
    const keyCardImages = document.getElementById("keyCardImages");
    const avoidRepeatCheckbox = document.getElementById("avoidRepeat");
    const settingsElement = document.getElementById("settings");

    let decks = [];
    let recentDrawnDeckIds = [];
    let isSpinning = false;

    const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

    function getDeckName(deck) {
      return deck?.name ?? deck?.deckName ?? deck?.["デッキ名"] ?? "名称不明";
    }

    // NotionのMulti-select「文明」を取得。/spinの返却に文明がない場合は/decksの情報を補完する。
    function getDeckCivilizations(deck) {
      const property = deck?.properties?.["文明"] ?? deck?.properties?.civilization;
      const raw = deck?.civilization ?? deck?.civilizations ?? deck?.文明
        ?? property?.multi_select ?? property?.select ?? property?.value ?? property;
      if (raw == null) return [];
      let values;
      if (Array.isArray(raw)) values = raw;
      else if (typeof raw === "string") values = raw.split(/[、,，/・]/);
      else if (Array.isArray(raw.multi_select)) values = raw.multi_select;
      else if (Array.isArray(raw.select)) values = raw.select;
      else if (typeof raw.name === "string") values = [raw.name];
      else if (typeof raw.value === "string") values = [raw.value];
      else return [];
      const aliases = new Map([
        ["火", "fire"], ["火文明", "fire"], ["水", "water"], ["水文明", "water"],
        ["自然", "nature"], ["自然文明", "nature"], ["光", "light"], ["光文明", "light"],
        ["闇", "darkness"], ["闇文明", "darkness"], ["ゼロ", "zero"], ["無色", "zero"],
        ["ゼロ/無色", "zero"], ["ゼロ／無色", "zero"]
      ]);
      const found = [];
      for (const value of values) {
        const name = typeof value === "string" ? value : value?.name ?? value?.title ?? value?.plain_text ?? "";
        const key = aliases.get(String(name).trim().replace(/\s/g, ""));
        if (key && !found.includes(key)) found.push(key);
      }
      return found;
    }

    function applyDeckCivilizationFrame(deck) {
      const palette = {
        fire: "#e53935", water: "#168bd2", nature: "#299b45",
        light: "#f2c600", darkness: "#743c9b", zero: "#d9e0eb"
      };
      const colors = getDeckCivilizations(deck).map(key => palette[key]).filter(Boolean);
      deckCase.classList.remove("civ-charging");
      deckCase.style.removeProperty("--case-civ-gradient");
      deckCase.style.removeProperty("--case-civ-glow");
      if (colors.length === 0) return;

      // 各文明に同じ幅を割り当て、全色を均等に見せる連続グラデーション。
      const stops = colors.map((color, index) => {
        const position = colors.length === 1 ? 50 : (index / (colors.length - 1)) * 100;
        return `${color} ${position}%`;
      }).join(", ");
      const gradient = `linear-gradient(115deg, ${stops})`;
      const rgb = colors.map(hex => hex.match(/[0-9a-f]{2}/gi).map(v => parseInt(v, 16)));
      const average = [0, 1, 2].map(channel => Math.round(rgb.reduce((sum, value) => sum + value[channel], 0) / rgb.length));
      const glow = `#${average.map(value => value.toString(16).padStart(2, "0")).join("")}`;
      deckCase.style.setProperty("--case-civ-gradient", gradient);
      deckCase.style.setProperty("--case-civ-glow", glow);
      // 次フレームでクラスを付け、色が瞬時に切り替わらずじわじわ立ち上がるようにする。
      requestAnimationFrame(() => deckCase.classList.add("civ-charging"));
    }

    function getKeyCardImageUrls(deck) {
      const candidates = deck?.keyCards ?? deck?.keyCardImages ?? deck?.key_cards ?? deck?.images ?? [];
      if (!Array.isArray(candidates)) return [];
      return candidates.map(item => {
        if (typeof item === "string") return item;
        return item?.url ?? item?.imageUrl ?? item?.image_url ?? item?.src ?? item?.["イメージ"] ?? null;
      }).filter(url => typeof url === "string" && /^https?:\/\//i.test(url));
    }

    function getExcludedDeckIds() {
      return avoidRepeatCheckbox.checked
        ? recentDrawnDeckIds.slice(0, 3)
        : [];
    }

    function renderDeckList() {
      deckListElement.replaceChildren();

      if (decks.length === 0) {
        const item = document.createElement("li");
        item.textContent = "抽選対象のデッキがありません。";
        deckListElement.appendChild(item);
        return;
      }

      const excludedIds = new Set(getExcludedDeckIds());

      decks.forEach(deck => {
        const item = document.createElement("li");
        item.textContent = getDeckName(deck);

        if (excludedIds.has(deck.id)) {
          item.classList.add("excluded");
          item.title = "直近3回の当選デッキのため、次の抽選から除外されます";
        }

        deckListElement.appendChild(item);
      });
    }

    function showDrawingCard() {
      cardStage.classList.remove("hidden", "winner", "absorption-burst");
      revealFlashElement.classList.remove("active");
      keyCardImages.replaceChildren();
      keyCardImages.classList.remove("case-launch");
      drawingCard.style.removeProperty("display");
      drawingCard.style.removeProperty("visibility");
      drawingCard.style.removeProperty("opacity");
      drawingCard.classList.remove("hidden", "charging", "absorbing");
      deckCase.classList.remove("opening", "civ-charging", "pressure");
      drawingCard.classList.remove("opening-cutin", "case-blast");
      deckCase.style.removeProperty("opacity");
      deckCase.style.removeProperty("transform");
      deckCase.style.removeProperty("transition");
      deckCase.style.removeProperty("--case-civ-gradient");
      deckCase.style.removeProperty("--case-civ-glow");
      deckCase.querySelector(".case-lid").style.removeProperty("transform");
      deckCase.querySelector(".case-lock").style.removeProperty("transform");
      const drawingFace = drawingCard.querySelector(".drawing-card");
      drawingFace.classList.remove("deck-civ-colored");
      drawingFace.style.removeProperty("--deck-civ-gradient");
      drawingFace.style.removeProperty("--deck-civ-glow");
      drawingCard.querySelectorAll(".mana-orb").forEach(icon => {
        icon.getAnimations().forEach(animation => animation.cancel());
        icon.style.opacity = "0";
        icon.style.transform = "translate(0,0) scale(.7)";
      });
    }

    // 五文明召喚→連続した渦巻き→一斉吸収の順に演出する。
    async function playManaSequence() {
      const icons = [...drawingCard.querySelectorAll(".mana-orb")];
      // 五文明は正円で周回。アイコン半径＋12pxの安全余白を四辺に確保する。
      const iconRadius = Math.max(...icons.map(icon => icon.getBoundingClientRect().width || 54)) / 2;
      const orbitRadius = Math.max(0, Math.min(drawingCard.clientWidth, drawingCard.clientHeight) / 2 - iconRadius - 12);
      const orbitRadiusX = orbitRadius;
      const orbitRadiusY = orbitRadius;
      const duration = 2850;
      const turns = 2.35;
      const colors = ["#ff5948", "#fff0a0", "#65e982", "#64d8ff", "#d5a0ff"];
      const canvas = document.createElement("canvas");
      canvas.id = "manaTrailCanvas";
      drawingCard.appendChild(canvas);
      const ctx = canvas.getContext("2d");
      const rect = drawingCard.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.round(rect.width * dpr);
      canvas.height = Math.round(rect.height * dpr);
      ctx.scale(dpr, dpr);

      const pointAt = (index, t) => {
        const startAngle = -Math.PI / 2 + (Math.PI * 2 * index / icons.length);
        const easedTurn = turns * (0.20 * t + 0.80 * t * t);
        const angle = startAngle + Math.PI * 2 * easedTurn;
        // 未定義の radius を参照せず、画面サイズから算出した楕円軌道を使う。
        // 吸収が進むほどX/Yそれぞれの半径を縮め、アイコンを中央へ集める。
        const convergence = Math.pow(1 - t, 0.88);
        return {
          x: rect.width / 2 + Math.cos(angle) * orbitRadiusX * convergence,
          y: rect.height / 2 + Math.sin(angle) * orbitRadiusY * convergence
        };
      };

      drawingCard.classList.add("charging");
      const animations = icons.map((icon, index) => {
        const frames = [];
        const steps = 120;
        for (let step = 0; step <= steps; step++) {
          const t = step / steps;
          const point = pointAt(index, t);
          const scale = 0.88 + 0.18 * t;
          const opacity = Math.min(1, t / 0.10) * Math.min(1, (1 - t) / 0.045);
          frames.push({
            transform: `translate(${point.x - rect.width / 2}px, ${point.y - rect.height / 2}px) scale(${scale})`,
            opacity: Math.max(0, opacity),
            offset: t
          });
        }
        return icon.animate(frames, { duration, easing: "linear", fill: "forwards" });
      });

      // 旋回中は短命の光粒子、終盤は幅のあるエネルギー波、
      // 吸収時は五文明色がカード中心に集まる光を描画する。
      // 線で軌道を結ばず、粒子やぼかした光だけで表現する。
      const startTime = performance.now();
      const particles = [];
      let lastEmission = 0;
      let trailFrame;
      const rand = (min, max) => min + Math.random() * (max - min);
      const drawTrails = now => {
        const t = Math.min(1, (now - startTime) / duration);
        const dt = Math.min(0.04, (now - (drawTrails.lastTime || now)) / 1000);
        drawTrails.lastTime = now;
        ctx.clearRect(0, 0, rect.width, rect.height);

        // ① 旋回中：アイコンの周囲から小さな粒子を控えめに放出
        if (t < 0.70 && now - lastEmission > 42) {
          lastEmission = now;
          icons.forEach((icon, index) => {
            const point = pointAt(index, t);
            const tangent = pointAt(index, Math.max(0, t - 0.012));
            const angle = Math.atan2(point.y - tangent.y, point.x - tangent.x);
            const count = t < 0.28 ? 1 : 2;
            for (let n = 0; n < count; n++) {
              const spread = angle + Math.PI + rand(-0.9, 0.9);
              particles.push({
                x: point.x + rand(-7, 7), y: point.y + rand(-7, 7),
                vx: Math.cos(spread) * rand(10, 34),
                vy: Math.sin(spread) * rand(10, 34),
                life: 0, maxLife: rand(0.28, 0.55),
                size: rand(1.2, 3.2), color: colors[index]
              });
            }
          });
        }
        for (let i = particles.length - 1; i >= 0; i--) {
          const p = particles[i];
          p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt;
          const alpha = Math.max(0, 1 - p.life / p.maxLife);
          if (alpha <= 0) { particles.splice(i, 1); continue; }
          ctx.save();
          ctx.globalAlpha = alpha * 0.82;
          ctx.fillStyle = p.color;
          ctx.shadowColor = p.color; ctx.shadowBlur = 9;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
        }

        // ②・③の控えめで差が分かりにくかった光の波／中心集中表現は廃止。
        // 粒子の演出から、抽選結果の文明色をまとったカード縁の発光へつなぐ。
        if (t < 1) trailFrame = requestAnimationFrame(drawTrails);
      };
      trailFrame = requestAnimationFrame(drawTrails);
      await sleep(2850);
      drawingCard.classList.add("absorbing");
      cardStage.classList.add("absorption-burst");

      await Promise.all(animations.map(animation => animation.finished));
      if (trailFrame) cancelAnimationFrame(trailFrame);
      ctx.clearRect(0, 0, rect.width, rect.height);
      canvas.remove();
      // アイコンはケースの中心まで渦を巻いて吸収。ケース側の光が強まり、蓋が開く。
      await sleep(180);
      drawingCard.classList.remove("charging", "absorbing");
      cardStage.classList.remove("absorption-burst");
      icons.forEach(icon => {
        icon.style.opacity = "0";
        icon.style.transform = "translate(0,0) scale(.7)";
      });
      // 抽選結果が確定するまではケースを閉じたままにし、開いたまま待つ時間を作らない。
    }

    // 同じデッキケースを使い、蓋の解放と光の噴出を短いテンポで連結する。
    async function playCaseOpeningSequence() {
      drawingCard.classList.add("opening-cutin");
      void drawingCard.offsetWidth;
      await sleep(220);
      deckCase.classList.add("pressure");
      await sleep(380);
      deckCase.classList.remove("pressure");
      deckCase.classList.add("opening");
      drawingCard.classList.add("case-blast");
      await sleep(300);
      revealFlashElement.classList.remove("active");
      void revealFlashElement.offsetWidth;
      revealFlashElement.classList.add("active");
      await sleep(720);
      revealFlashElement.classList.remove("active");
      drawingCard.classList.remove("case-blast");
      // 蓋は開いた状態を保ち、キーカード射出の直後にケースを退場させる。
    }

    function createParticles() {
      cardStage.querySelectorAll(".particle").forEach(p => p.remove());

      const centerX = cardStage.clientWidth / 2;
      const centerY = cardStage.clientHeight / 2;

      for (let i = 0; i < 26; i++) {
        const particle = document.createElement("span");
        particle.className = "particle";

        const angle = Math.random() * Math.PI * 2;
        const distance = 65 + Math.random() * 160;

        particle.style.left = `${centerX}px`;
        particle.style.top = `${centerY}px`;
        particle.style.setProperty("--dx", `${Math.cos(angle) * distance}px`);
        particle.style.setProperty("--dy", `${Math.sin(angle) * distance}px`);
        particle.style.setProperty("--size", `${3 + Math.random() * 6}px`);
        particle.style.setProperty("--duration", `${0.65 + Math.random() * 0.65}s`);

        cardStage.appendChild(particle);
        particle.addEventListener("animationend", () => particle.remove(), { once: true });
      }
    }

    async function showKeyCards(deck) {
      // ケースを残したままカードを重ね、飛び出し始めてからケースを退場させる。
      keyCardImages.replaceChildren();
      keyCardImages.classList.remove("case-launch");

      const imageUrls = getKeyCardImageUrls(deck);

      if (imageUrls.length === 0) {
        const fallback = document.createElement("div");
        fallback.className = "fallback";
        fallback.textContent = "キーカード画像が取得できませんでした。";
        keyCardImages.appendChild(fallback);
      } else {
        imageUrls.forEach((url, index) => {
          const img = document.createElement("img");
          img.src = url;
          img.alt = `${getDeckName(deck)} のキーカード ${index + 1}`;
          img.loading = "eager";

          img.addEventListener("error", () => {
            img.alt = "画像を読み込めませんでした";
            img.style.display = "none";

            const visibleImages = [...keyCardImages.querySelectorAll("img")]
              .some(image => image.style.display !== "none");

            if (!visibleImages) {
              const fallback = document.createElement("div");
              fallback.className = "fallback";
              fallback.textContent = "キーカード画像を読み込めませんでした。";
              keyCardImages.appendChild(fallback);
            }
          }, { once: true });

          keyCardImages.appendChild(img);
        });

        // 蓋が開き始める短い瞬間だけ待ち、開放の勢いにカード射出を同期させる。
        await sleep(105);
        void keyCardImages.offsetWidth;
        keyCardImages.classList.add("case-launch");
      }

      // カードがケースから飛び出した後、ケースを奥へ退かせてカードを主役にする。
      await sleep(900);
      keyCardImages.classList.remove("case-launch");
      deckCase.style.transition = "opacity .28s ease, transform .38s ease";
      deckCase.style.opacity = "0";
      deckCase.style.transform = "translate(-50%,-58%) perspective(650px) rotateX(7deg) scale(.82)";
      // winnerへの切替は結果名の表示後に親側で行う。
    }

    async function loadDecks() {
      spinButton.disabled = true;
      spinButton.textContent = "準備中...";
      statusElement.textContent = "デッキを読み込み中です。";

      try {
        const response = await fetch(`${API_BASE}/decks`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || `デッキ取得に失敗しました（HTTP ${response.status}）`);
        }

        decks = Array.isArray(data) ? data : (data.decks ?? []);
        renderDeckList();

        if (decks.length === 0) {
          statusElement.textContent = "抽選対象のデッキがありません。Notionの設定を確認してください。";
          return;
        }

        statusElement.textContent = `抽選対象：${decks.length}デッキ`;
        spinButton.textContent = "抽選スタート";
        spinButton.disabled = false;
      } catch (error) {
        console.error(error);
        decks = [];
        renderDeckList();
        statusElement.textContent = "デッキを取得できませんでした。通信設定を確認してください。";
        spinButton.textContent = "準備中...";
        spinButton.disabled = true;
      }
    }

    async function requestDraw() {
      const excludeDeckIds = getExcludedDeckIds();

      const response = await fetch(`${API_BASE}/spin`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ excludeDeckIds })
      });

      let data;

      try {
        data = await response.json();
      } catch {
        throw new Error("Workerから正しい形式の応答がありませんでした。");
      }

      if (!response.ok) {
        throw new Error(data.error || `抽選に失敗しました（HTTP ${response.status}）`);
      }

      const deck = data.deck ?? data;

      if (!deck || !deck.id || !getDeckName(deck)) {
        throw new Error("抽選結果の形式が正しくありません。");
      }

      if (excludeDeckIds.includes(deck.id)) {
        throw new Error("Workerが除外対象のデッキを返しました。Workerの設定を確認してください。");
      }

      return deck;
    }

    async function spin() {
      if (isSpinning || decks.length === 0) return;

      isSpinning = true;
      spinButton.disabled = true;
      spinButton.classList.add("hidden");
      statusElement.classList.add("hidden");
      settingsElement.classList.add("hidden");

      resultElement.classList.remove("result-reveal");
      resultElement.textContent = "";
      resultElement.classList.remove("has-result");
      showDrawingCard();

      try {
        const excludedIds = new Set(getExcludedDeckIds());
        const candidates = decks.filter(deck => !excludedIds.has(deck.id));

        if (candidates.length === 0) {
          throw new Error("直近3回の当選デッキを除外すると抽選できません。抽選対象のデッキを増やすか、重複除外を解除してください。");
        }

        // API抽選と演出を並行させ、演出終了後に結果を公開する。
        const drawResult = requestDraw().then(
          deck => {
            // /spinがID・名前・画像だけを返す場合に備え、/decksの完全なレコードと統合する。
            const listedDeck = decks.find(item => String(item.id) === String(deck.id));
            const completeDeck = listedDeck ? { ...listedDeck, ...deck } : deck;
            // 抽選結果が届いた時点で文明色を適用し、吸収演出中から見えるようにする。
            applyDeckCivilizationFrame(completeDeck);
            return { deck: completeDeck };
          },
          error => ({ error })
        );
        await playManaSequence();

        // 初期画面と同じ乳白色ケースを、そのままCSSアニメーションで開封する。
        await playCaseOpeningSequence();

        const outcome = await drawResult;
        if (outcome.error) throw outcome.error;
        const deck = outcome.deck;
        const deckName = getDeckName(deck);
        applyDeckCivilizationFrame(deck);

        // 最新の当選デッキを先頭に追加し、直近3個を保持
        recentDrawnDeckIds = [
          deck.id,
          ...recentDrawnDeckIds.filter(id => id !== deck.id)
        ].slice(0, 3);

        renderDeckList();

        const cardLaunch = showKeyCards(deck);
        await Promise.all([cardLaunch, sleep(620)]);
        resultElement.replaceChildren();
        const resultEyebrow = document.createElement("span");
        resultEyebrow.className = "result-eyebrow";
        resultEyebrow.textContent = "今回の当選デッキ";
        const resultTitle = document.createElement("span");
        resultTitle.className = "deck-name-title";
        resultTitle.textContent = deckName;
        resultElement.append(resultEyebrow, resultTitle);
        resultElement.classList.add("has-result");
        void resultElement.offsetWidth;
        resultElement.classList.add("result-reveal");
        // 結果名が見え始めてから演出行を縮める。
        await sleep(760);
        
        cardStage.classList.add("winner");
        createParticles();

        const eligibleCount = candidates.length;
        statusElement.textContent = `抽選完了（対象 ${eligibleCount} デッキ）`;

        await sleep(900);
      } catch (error) {
        console.error(error);
        resultElement.textContent = "抽選に失敗しました";
        resultElement.classList.add("has-result");
        keyCardImages.replaceChildren();
        cardStage.classList.remove("winner");

        const fallback = document.createElement("div");
        fallback.className = "fallback";
        fallback.textContent = error.message || "通信状態を確認して、もう一度お試しください。";
        keyCardImages.appendChild(fallback);

        statusElement.textContent = "抽選できませんでした。設定を確認して、もう一度お試しください。";
      } finally {
        drawingCard.classList.add("hidden");
        spinButton.classList.remove("hidden");
        spinButton.textContent = "抽選スタート";
        spinButton.disabled = decks.length === 0;
        statusElement.classList.remove("hidden");
        settingsElement.classList.remove("hidden");
        isSpinning = false;
      }
    }

    avoidRepeatCheckbox.addEventListener("change", renderDeckList);
    spinButton.addEventListener("click", spin);
    loadDecks();
  </script>
</body>
</html>

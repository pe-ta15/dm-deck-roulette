
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DMデッキルーレット</title>

  <style>
    :root {
      color-scheme: light;
      --bg: #f5f6f8;
      --panel: #ffffff;
      --accent: #e9b94f;
      --text: #252a35;
      --muted: #6f7787;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px 48px;
      background:
        radial-gradient(ellipse at top, #ffffff 0%, transparent 70%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      text-align: center;
    }

    main {
      width: 100%;
      max-width: 850px;
      margin: 0 auto;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(1.8rem, 5vw, 2.7rem);
      letter-spacing: 0.04em;
    }

    .subtitle {
      color: var(--muted);
      margin: 0 0 28px;
    }

    .panel {
      padding: 22px;
      margin-bottom: 22px;
      border: 1px solid #e1e4eb;
      border-radius: 18px;
      background: rgb(255 255 255 / 95%);
      box-shadow: 0 8px 28px rgb(35 45 65 / 8%);
    }

    .settings {
      display: flex;
      justify-content: center;
      margin: 20px 0 0;
    }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border: 1px solid #e1e4eb;
      border-radius: 12px;
      background: #f8f9fb;
      cursor: pointer;
      text-align: left;
    }

    .checkbox-label input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      flex: 0 0 auto;
    }

    button {
      min-height: 48px;
      padding: 12px 28px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #ffe6a1, #e9ae42);
      color: #241908;
      font-size: 1.05rem;
      font-weight: 800;
      cursor: pointer;
      transition: transform 0.15s, filter 0.15s;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    button:disabled {
      background: #b8bdc7;
      color: #ffffff;
      opacity: 1;
      cursor: wait;
      box-shadow: none;
      transform: none;
      filter: none;
    }

    #status {
      min-height: 24px;
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
    }

    .hidden {
      display: none !important;
    }

    #result {
      margin: 0 0 18px;
      min-height: 0;
      display: grid;
      place-items: center;
      overflow-wrap: anywhere;
      font-size: clamp(1.45rem, 5vw, 2.2rem);
      font-weight: 900;
    }

    #result:empty {
      display: none;
    }

    #result.has-result {
      min-height: 58px;
      margin: 22px 0 18px;
    }

    .result-reveal {
      animation: resultReveal 0.75s ease-out both;
    }

    @keyframes resultReveal {
      0% {
        opacity: 0;
        transform: scale(0.65);
        text-shadow: 0 0 0 transparent;
      }
      55% {
        opacity: 1;
        transform: scale(1.12);
        text-shadow:
          0 0 12px #fff0b2,
          0 0 32px #ffcf57,
          0 0 58px #f99c28;
      }
      100% {
        opacity: 1;
        transform: scale(1);
        text-shadow: 0 0 18px rgb(255 205 92 / 40%);
      }
    }

    /* 抽選中・結果表示エリア */
    .card-stage {
      position: relative;
      width: 100%;
      max-width: 620px;
      min-height: 250px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      isolation: isolate;
    }

    /* カードと画像を必ず中央に配置 */
    .drawing-card {
      width: 180px;
      max-width: 100%;
      flex: 0 0 180px;
      margin: 0 auto;
      aspect-ratio: 5 / 7;
      border: 2px solid #aab4cf;
      border-radius: 13px;
      background:
        radial-gradient(circle at center, #e8ecf7 0%, #cbd3e8 48%, #aab6d4 100%);
      box-shadow: 0 0 24px rgb(109 143 255 / 28%);
      display: grid;
      place-items: center;
      position: relative;
      overflow: hidden;
      animation: cardPulse 1.2s ease-in-out infinite alternate;
    }

    .drawing-card::before {
      content: "";
      position: absolute;
      inset: 10px;
      border: 1px solid rgb(255 255 255 / 55%);
      border-radius: 8px;
    }

    .drawing-card::after {
      content: "DM";
      position: absolute;
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      color: rgb(255 255 255 / 35%);
    }

    .drawing-label {
      z-index: 1;
      padding: 8px 12px;
      border-radius: 8px;
      background: rgb(10 13 24 / 78%);
      color: #fff;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    @keyframes cardPulse {
      from {
        transform: scale(0.97);
        box-shadow: 0 0 16px rgb(109 143 255 / 20%);
      }
      to {
        transform: scale(1.02);
        box-shadow: 0 0 34px rgb(109 143 255 / 50%);
      }
    }

    /* キーカードを中央揃え */
    #keyCardImages {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 14px;
      width: 100%;
      margin: 0 auto;
      padding: 12px 0;
    }

    #keyCardImages img {
      display: block;
      flex: 0 1 auto;
      width: min(180px, 42vw);
      height: auto;
      max-height: 360px;
      object-fit: contain;
      border-radius: 9px;
      box-shadow: 0 8px 20px rgb(0 0 0 / 20%);
      transform-style: preserve-3d;
      backface-visibility: visible;
    }

    /* カード裏面から表面へ回転 */
    #keyCardImages.revealing img {
      animation: cardFlipIn 0.9s cubic-bezier(0.2, 0.75, 0.25, 1) both;
    }

    #keyCardImages.revealing img:nth-child(2) {
      animation-delay: 0.12s;
    }

    #keyCardImages.revealing img:nth-child(3) {
      animation-delay: 0.24s;
    }

    @keyframes cardFlipIn {
      0% {
        opacity: 0;
        transform: perspective(900px) rotateY(180deg) scale(0.72);
        filter: brightness(0.35);
      }
      55% {
        opacity: 1;
        transform: perspective(900px) rotateY(0deg) scale(1.06);
        filter: brightness(1.8);
      }
      100% {
        opacity: 1;
        transform: perspective(900px) rotateY(0deg) scale(1);
        filter: brightness(1);
      }
    }

    /* 当選時の光 */
    .card-stage.winner::before {
      content: "";
      position: absolute;
      z-index: 0;
      left: 50%;
      top: 50%;
      width: 230px;
      height: 230px;
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(
        circle,
        rgb(255 246 190 / 80%) 0%,
        rgb(255 204 74 / 42%) 28%,
        rgb(255 157 41 / 15%) 55%,
        transparent 72%
      );
      animation: lightBurst 1.1s ease-out both;
    }

    .card-stage.winner::after {
      content: "";
      position: absolute;
      z-index: 0;
      left: 50%;
      top: 50%;
      width: 190px;
      height: 190px;
      border: 2px solid rgb(255 224 128 / 85%);
      border-radius: 50%;
      pointer-events: none;
      animation: ringBurst 0.9s ease-out both;
    }

    @keyframes lightBurst {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.1);
      }
      35% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(2.5);
      }
    }

    @keyframes ringBurst {
      0% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(0.2);
      }
      20% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(2.1);
      }
    }

    /* 粒子 */
    .particle {
      position: absolute;
      z-index: 3;
      width: var(--size, 6px);
      height: var(--size, 6px);
      border-radius: 50%;
      pointer-events: none;
      background: radial-gradient(circle, #fffbdc 0%, #ffd45e 55%, #ff9c2d 100%);
      box-shadow: 0 0 9px 2px rgb(255 213 96 / 75%);
      animation: particleFly var(--duration, 1s) ease-out forwards;
    }

    @keyframes particleFly {
      0% {
        opacity: 0;
        transform: translate(0, 0) scale(0.2);
      }
      15% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translate(var(--dx), var(--dy)) scale(0);
      }
    }

    .fallback {
      width: 100%;
      padding: 28px 14px;
      color: var(--muted);
      line-height: 1.7;
    }

    .deck-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
      padding: 0;
      margin: 18px 0 0;
      list-style: none;
      text-align: left;
    }

    .deck-list li {
      padding: 12px 14px;
      border: 1px solid #e1e4eb;
      border-radius: 10px;
      background: #f8f9fb;
      overflow-wrap: anywhere;
    }

    .deck-list li.excluded {
      opacity: 0.48;
    }

    .small-note {
      color: var(--muted);
      font-size: 0.85rem;
      line-height: 1.6;
    }

    @media (max-width: 480px) {
      body {
        padding: 22px 12px 36px;
      }

      .panel {
        padding: 16px 12px;
      }

      .card-stage {
        min-height: 220px;
      }

      .drawing-card {
        width: 150px;
        flex-basis: 150px;
      }

      #keyCardImages img {
        width: min(155px, 42vw);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }
    /* 抽選中のカードを画面中央に固定 */
    #cardStage {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      justify-items: center;
      align-items: center;
      width: 100%;
    }
    
    /* 抽選中カードの中央配置 */
    #cardStage #drawingCard {
      grid-column: 1;
      grid-row: 1;
      justify-self: center;
      margin: 0 auto;
    }
    
    /* キーカード画像も同じ中央位置を基準に配置 */
    #cardStage #keyCardImages {
      grid-column: 1;
      grid-row: 1;
      justify-self: stretch;
      width: 100%;
      min-width: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin: 0 auto;
    }
  </style>
</head>

<body>
  <main>
    <h1>DMデッキルーレット</h1>
    <p class="subtitle">次に使用するデッキを抽選します</p>

    <section class="panel">

      <!-- 結果表示エリア：初回抽選前は非表示 -->
      <div id="result" aria-live="polite"></div>

      <div id="cardStage" class="card-stage hidden">
        <div id="drawingCard" class="drawing-card hidden">
          <span class="drawing-label">抽選中</span>
        </div>
        <div id="keyCardImages"></div>
      </div>

      <!-- 抽選ボタン -->
      <button type="button" id="spinButton" disabled>準備中...</button>

      <p id="status" role="status" aria-live="polite">
        デッキを読み込み中です。
      </p>

      <!-- 重複除外設定 -->
      <div id="settings" class="settings">
        <label class="checkbox-label">
          <input type="checkbox" id="avoidRepeat">
          <span>直前の当選デッキを次の抽選から除外する</span>
        </label>
      </div>

    </section>

    <section class="panel">
      <h2>抽選対象のデッキ</h2>
      <p class="small-note">
        Notionで「ルーレット」にチェックしたデッキが対象です。
      </p>
      <ul id="deckList" class="deck-list"></ul>
    </section>
  </main>

  <script>
    const API_BASE =
      "https://dm-deck-roulette-api.nabkde16ngh.workers.dev";

    const spinButton = document.getElementById("spinButton");
    const statusElement = document.getElementById("status");
    const resultElement = document.getElementById("result");
    const deckListElement = document.getElementById("deckList");
    const drawingCard = document.getElementById("drawingCard");
    const cardStage = document.getElementById("cardStage");
    const keyCardImages = document.getElementById("keyCardImages");
    const avoidRepeatCheckbox = document.getElementById("avoidRepeat");
    const settingsElement = document.getElementById("settings");

    let decks = [];
    let lastDrawnDeckName = null;
    let isSpinning = false;

    const sleep = ms =>
      new Promise(resolve => setTimeout(resolve, ms));

    function getDeckName(deck) {
      return deck?.name ??
        deck?.deckName ??
        deck?.["デッキ名"] ??
        "名称不明";
    }

    function getKeyCardImageUrls(deck) {
      const candidates =
        deck?.keyCards ??
        deck?.keyCardImages ??
        deck?.key_cards ??
        deck?.images ??
        [];

      if (!Array.isArray(candidates)) {
        return [];
      }

      return candidates
        .map(item => {
          if (typeof item === "string") return item;

          return item?.url ??
            item?.imageUrl ??
            item?.image_url ??
            item?.src ??
            item?.["イメージ"] ??
            null;
        })
        .filter(url =>
          typeof url === "string" &&
          /^https?:\/\//i.test(url)
        );
    }

    function renderDeckList() {
      deckListElement.replaceChildren();

      if (decks.length === 0) {
        const item = document.createElement("li");
        item.textContent = "抽選対象のデッキがありません。";
        deckListElement.appendChild(item);
        return;
      }

      decks.forEach(deck => {
        const name = getDeckName(deck);
        const item = document.createElement("li");
        item.textContent = name;

        if (
          avoidRepeatCheckbox.checked &&
          lastDrawnDeckName &&
          name === lastDrawnDeckName
        ) {
          item.classList.add("excluded");
          item.title = "次の抽選から除外されます";
        }

        deckListElement.appendChild(item);
      });
    }

    function showDrawingCard() {
      cardStage.classList.remove("hidden");
      keyCardImages.replaceChildren();
      keyCardImages.classList.remove("revealing");
      cardStage.classList.remove("winner");
      drawingCard.classList.remove("hidden");
    }

    function createParticles() {
      cardStage.querySelectorAll(".particle").forEach(p => p.remove());

      const centerX = cardStage.clientWidth / 2;
      const centerY = cardStage.clientHeight / 2;

      for (let i = 0; i < 38; i++) {
        const particle = document.createElement("span");
        particle.className = "particle";

        const angle = Math.random() * Math.PI * 2;
        const distance = 65 + Math.random() * 160;
        const dx = Math.cos(angle) * distance;
        const dy = Math.sin(angle) * distance;

        particle.style.left = `${centerX}px`;
        particle.style.top = `${centerY}px`;
        particle.style.setProperty("--dx", `${dx}px`);
        particle.style.setProperty("--dy", `${dy}px`);
        particle.style.setProperty("--size", `${3 + Math.random() * 6}px`);
        particle.style.setProperty(
          "--duration",
          `${0.65 + Math.random() * 0.65}s`
        );

        cardStage.appendChild(particle);
        particle.addEventListener(
          "animationend",
          () => particle.remove(),
          { once: true }
        );
      }
    }

    async function showKeyCards(deck) {
      drawingCard.classList.add("hidden");
      keyCardImages.replaceChildren();
      keyCardImages.classList.remove("revealing");

      const imageUrls = getKeyCardImageUrls(deck);

      if (imageUrls.length === 0) {
        const fallback = document.createElement("div");
        fallback.className = "fallback";
        fallback.textContent =
          "キーカード画像がありません。Workerから返される画像データを確認してください。";
        keyCardImages.appendChild(fallback);
      } else {
        imageUrls.forEach((url, index) => {
          const img = document.createElement("img");
          img.src = url;
          img.alt = `${getDeckName(deck)} のキーカード ${index + 1}`;
          img.loading = "eager";

          img.addEventListener("error", () => {
            img.alt = "画像を読み込めませんでした";
            img.style.display = "none";

            const visibleImages = [
              ...keyCardImages.querySelectorAll("img")
            ].some(image => image.style.display !== "none");

            if (!visibleImages) {
              const fallback = document.createElement("div");
              fallback.className = "fallback";
              fallback.textContent =
                "キーカード画像を読み込めませんでした。";
              keyCardImages.appendChild(fallback);
            }
          }, { once: true });

          keyCardImages.appendChild(img);
        });

        void keyCardImages.offsetWidth;
        keyCardImages.classList.add("revealing");
      }

      cardStage.classList.remove("winner");
      void cardStage.offsetWidth;
      cardStage.classList.add("winner");
      createParticles();
    }

    
    async function loadDecks() {
      // 読み込み開始時は必ず準備中にする
      spinButton.disabled = true;
      spinButton.textContent = "準備中...";
      statusElement.textContent = "デッキを読み込み中です。";
    
      try {
        const response = await fetch(`${API_BASE}/decks`);
    
        if (!response.ok) {
          throw new Error(
            `デッキ取得に失敗しました（HTTP ${response.status}）`
          );
        }
    
        const data = await response.json();
        decks = Array.isArray(data) ? data : (data.decks ?? []);
    
        renderDeckList();
    
        if (decks.length === 0) {
          statusElement.textContent =
            "抽選対象のデッキがありません。Notionの設定を確認してください。";
          return;
        }
    
        statusElement.textContent = `抽選対象：${decks.length}デッキ`;
    
        // デッキ取得完了後に抽選可能にする
        spinButton.textContent = "抽選スタート";
        spinButton.disabled = false;
    
      } catch (error) {
        console.error(error);
    
        decks = [];
        renderDeckList();
    
        statusElement.textContent =
          "デッキを取得できませんでした。通信設定を確認してください。";
    
        // 取得失敗時は準備中のまま無効化する
        spinButton.textContent = "準備中...";
        spinButton.disabled = true;
      }
    }

    async function requestDraw() {
      const avoidRepeat = avoidRepeatCheckbox.checked;

      const canAvoidRepeat =
        avoidRepeat &&
        lastDrawnDeckName &&
        decks.some(deck =>
          getDeckName(deck) !== lastDrawnDeckName
        );

      let selectedDeck = null;
      const maxAttempts = canAvoidRepeat ? 12 : 1;

      for (let attempt = 0; attempt < maxAttempts; attempt++) {
        const response = await fetch(`${API_BASE}/spin`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({})
        });

        if (!response.ok) {
          throw new Error(
            `抽選に失敗しました（HTTP ${response.status}）`
          );
        }

        const data = await response.json();
        const deck = data.deck ?? data;

        if (!deck || !getDeckName(deck)) {
          throw new Error("抽選結果の形式が正しくありません。");
        }

        selectedDeck = deck;

        if (
          !canAvoidRepeat ||
          getDeckName(deck) !== lastDrawnDeckName
        ) {
          break;
        }
      }

      if (
        canAvoidRepeat &&
        selectedDeck &&
        getDeckName(selectedDeck) === lastDrawnDeckName
      ) {
        const alternatives = decks.filter(
          deck => getDeckName(deck) !== lastDrawnDeckName
        );

        if (alternatives.length > 0) {
          selectedDeck =
            alternatives[
              Math.floor(Math.random() * alternatives.length)
            ];
        }
      }

      return selectedDeck;
    }

    async function spin() {
      if (isSpinning || decks.length === 0) return;

      isSpinning = true;
      spinButton.disabled = true;
      spinButton.classList.add("hidden");
      statusElement.classList.add("hidden");
      settingsElement.classList.add("hidden");

      resultElement.classList.remove("result-reveal");
      resultElement.classList.add("has-result");

      showDrawingCard();

      try {
        const canAvoidRepeat =
          avoidRepeatCheckbox.checked &&
          lastDrawnDeckName &&
          decks.some(deck =>
            getDeckName(deck) !== lastDrawnDeckName
          );

        const candidates = canAvoidRepeat
          ? decks.filter(
              deck => getDeckName(deck) !== lastDrawnDeckName
            )
          : decks;

        if (candidates.length === 0) {
          throw new Error("抽選対象のデッキがありません。");
        }

        // 徐々に減速するルーレット演出
        for (let i = 0; i < 20; i++) {
          const randomDeck =
            candidates[
              Math.floor(Math.random() * candidates.length)
            ];

          resultElement.textContent = getDeckName(randomDeck);

          const progress = i / 19;
          await sleep(45 + 300 * progress * progress);
        }

        const deck = await requestDraw();
        const deckName = getDeckName(deck);

        resultElement.textContent = deckName;
        lastDrawnDeckName = deckName;

        renderDeckList();

        await showKeyCards(deck);

        void resultElement.offsetWidth;
        resultElement.classList.add("result-reveal");

        const eligibleCount =
          avoidRepeatCheckbox.checked && decks.length > 1
            ? decks.length - 1
            : decks.length;

        statusElement.textContent =
          `抽選完了（対象 ${eligibleCount} デッキ）`;

        await sleep(900);
      } catch (error) {
        console.error(error);

        resultElement.textContent = "抽選に失敗しました";
        keyCardImages.replaceChildren();

        const fallback = document.createElement("div");
        fallback.className = "fallback";
        fallback.textContent =
          error.message ||
          "通信状態を確認して、もう一度お試しください。";

        keyCardImages.appendChild(fallback);
      } finally {
        drawingCard.classList.add("hidden");
        spinButton.classList.remove("hidden");
        spinButton.disabled = decks.length === 0;
        statusElement.classList.remove("hidden");
        settingsElement.classList.remove("hidden");
        isSpinning = false;
      }
    }

    avoidRepeatCheckbox.addEventListener("change", renderDeckList);
    spinButton.addEventListener("click", spin);

    loadDecks();
  </script>
</body>
</html>
